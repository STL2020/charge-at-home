# eCharge@Home — Docker-Zusammenstellung
#
# Für NAS (Synology, QNAP), Portainer, Raspberry Pi oder jeden Rechner mit
# Docker. Der Container läuft im Hintergrund und startet nach einem Neustart
# des Geräts von selbst wieder — das ist der Vorteil gegenüber der lokalen
# Installation.
#
#   Aufruf:   docker compose up -d
#   Aufrufen: http://<IP-des-Geräts>:8501

services:
  echarge-at-home:
    # Aus dem beiliegenden Dockerfile bauen. Wer ein fertiges Abbild nutzt,
    # ersetzt diese Zeile durch:  image: echarge/at-home:latest
    build: .

    container_name: echarge-at-home

    # unless-stopped: startet nach Stromausfall und Neustart selbsttätig,
    # bleibt aber aus, wenn er ausdrücklich angehalten wurde.
    restart: unless-stopped

    ports:
      - "8501:8501"   # Weboberfläche
      - "9000:9000"   # OCPP 1.6-J — nur nötig, wenn Wallboxen sich direkt
                      # hier anmelden sollen (Vollversion)

    volumes:
      # Alle Daten liegen hier: Datenbank, erzeugte Belege, Einstellungen.
      # Dieses Verzeichnis sichern — mehr braucht es für ein Backup nicht.
      - ./data:/srv/data

    environment:
      # Zeitzone bestimmt die Zeitstempel in Belegen und Protokoll.
      - TZ=Europe/Berlin

    # Prüft, ob die Anwendung antwortet. Portainer und Synology zeigen das
    # als Zustand an; ohne diese Angabe gilt ein hängender Container als
    # gesund.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
