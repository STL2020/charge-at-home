# Veröffentlicht das LoxBerry-Plugin als GitHub-Release.
#
# LoxBerry liest Updates über den RELEASEFEED-Eintrag in plugin.cfg —
# das ist die URL zum neuesten Release-Asset auf GitHub. Sobald ein neues
# Release hochgeladen wird, zeigt LoxBerry dem Nutzer "Update verfügbar".
#
# Auslöser: Ein Tag der Form "plugin-v2.9.3" wird gepusht.
# Damit bleibt der Plugin-Release vom Docker-Release getrennt.
#
# Einmalig einzurichten: keine Secrets nötig — GITHUB_TOKEN reicht.
# Settings → Actions → General → "Read and write permissions"

name: Plugin-Release veröffentlichen

on:
  push:
    tags:
      - 'plugin-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Version aus Tag ermitteln
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/plugin-v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Plugin-Version: $TAG"

      - name: Plugin-ZIP erstellen
        run: |
          # Aus dem plugin/-Unterverzeichnis ein sauberes ZIP bauen.
          # Der Name muss mit dem RELEASEFEED in plugin.cfg übereinstimmen.
          cd plugin
          zip -r ../eChargeHome-OCPP-LoxBerry.zip . \
            -x "*.pyc" -x "*__pycache__*"
          echo "ZIP erstellt: $(ls -lh ../eChargeHome-OCPP-LoxBerry.zip | awk '{print $5}')"

      - name: GitHub-Release anlegen und ZIP hochladen
        uses: softprops/action-gh-release@v2
        with:
          name: "LoxBerry OCPP Plugin v${{ steps.ver.outputs.version }}"
          body: |
            ## eCharge@Home OCPP Plugin v${{ steps.ver.outputs.version }}

            LoxBerry-Plugin für OCPP 1.6-J Wallboxen.

            ### Installation
            LoxBerry → Plugin-Manager → ZIP-Datei hochladen

            ### Update
            LoxBerry → Plugin-Manager → Plugin auswählen → Update prüfen

            Vollständige Dokumentation und Abrechnungssoftware: **[loewemann.com](https://www.loewemann.com)**
          files: eChargeHome-OCPP-LoxBerry.zip
          tag_name: ${{ github.ref_name }}
