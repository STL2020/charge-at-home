# eCharge@Home — Stack für Portainer
#
# Portainer kann Abbilder nicht aus einem lokalen Verzeichnis bauen. Deshalb
# gibt es zwei Wege:
#
#   A) Abbild vorher selbst bauen (auf einem Rechner mit Docker):
#         docker build -t echarge/at-home:latest .
#         docker save echarge/at-home:latest -o echarge.tar
#      Dann in Portainer unter Images → Import die Datei echarge.tar laden
#      und diesen Stack anlegen.
#
#   B) Stack mit Git-Herkunft anlegen und dort auf docker-compose.yml
#      verweisen — Portainer baut das Abbild dann selbst.
#
# Danach: Stacks → Add stack → diesen Inhalt einfügen → Deploy.

services:
  echarge-at-home:
    image: echarge/at-home:latest
    container_name: echarge-at-home
    restart: unless-stopped

    ports:
      - "8501:8501"   # Weboberfläche
      - "9000:9000"   # OCPP 1.6-J (nur für die Vollversion nötig)

    volumes:
      # WICHTIG: Pfad an das eigene Gerät anpassen.
      #   Synology:     /volume1/docker/echarge/data
      #   QNAP:         /share/Container/echarge/data
      #   Raspberry Pi: /home/pi/echarge/data
      #   Unraid:       /mnt/user/appdata/echarge/data
      - /volume1/docker/echarge/data:/srv/data

    environment:
      - TZ=Europe/Berlin

    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
