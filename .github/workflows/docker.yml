# Baut das Docker-Abbild und legt es in der GitHub Container Registry ab.
#
# Ausgeloest bei:
#   - jedem Push auf main          -> Marke 'latest'
#   - jedem Tag der Form v1.2.3    -> Marken '1.2.3', '1.2', 'latest'
#   - von Hand ueber die Actions-Oberflaeche
#
# Ergebnis (zwei Ziele):
#   ghcr.io/stl2020/charge-at-home:latest      GitHub Container Registry
#   l0ewe/charge-at-home:latest                Docker Hub
#
# Docker Hub ist noetig, weil der Synology Container Manager und die QNAP
# Container Station bei der Suche ausschliesslich dort nachsehen. Ueber
# ghcr.io laesst sich zwar ziehen, aber nur mit vollstaendiger Adresse.
#
# Einmalig einzurichten:
#
#   1. Settings -> Actions -> General -> "Read and write permissions"
#      (fuer ghcr.io; ein Schluessel ist nicht noetig, GITHUB_TOKEN reicht)
#
#   2. Settings -> Secrets and variables -> Actions -> New repository secret
#      DOCKERHUB_USERNAME   der Docker-Hub-Benutzername
#      DOCKERHUB_TOKEN      ein Access Token aus hub.docker.com
#                           (Account Settings -> Personal access tokens,
#                            Berechtigung "Read & Write")
#
# Fehlen die beiden Secrets, wird nur nach ghcr.io veroeffentlicht — der
# Durchlauf schlaegt deswegen nicht fehl.

name: Docker-Abbild bauen

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      # Fuer ARM-Abbilder (Raspberry Pi, Synology mit ARM-Prozessor)
      - name: QEMU einrichten
        uses: docker/setup-qemu-action@v3

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der GitHub-Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Namen und Ziele ermitteln
        id: hub
        run: |
          # Beide Registries verlangen Kleinbuchstaben; github.repository
          # liefert den Namen in der Schreibweise des Kontos.
          echo "klein=$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
          # Nur der Paketname, ohne Konto — auf Docker Hub gehoert er unter
          # den dortigen Benutzernamen, der abweichen kann.
          echo "paket=$(echo '${{ github.event.repository.name }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "aktiv=ja" >> "$GITHUB_OUTPUT"
          else
            echo "aktiv=nein" >> "$GITHUB_OUTPUT"
            echo "Kein DOCKERHUB_TOKEN hinterlegt — es wird nur nach ghcr.io veroeffentlicht."
          fi

      # Uebersprungen, wenn keine Zugangsdaten hinterlegt sind — der
      # Durchlauf soll ohne Docker-Hub-Konto nicht scheitern.
      - name: An Docker Hub anmelden
        if: steps.hub.outputs.aktiv == 'ja'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Marken und Beschriftung ermitteln
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Beide Ziele: Die Marken werden fuer jedes erzeugt, sodass ein
          # einziger Bauvorgang genuegt.
          images: |
            ${{ env.REGISTRY }}/${{ steps.hub.outputs.klein }}
            ${{ steps.hub.outputs.aktiv == 'ja' && format('docker.io/{0}/{1}', secrets.DOCKERHUB_USERNAME, steps.hub.outputs.paket) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=eCharge@Home
            org.opencontainers.image.description=Ladeabrechnung und Fahrtenbuch für Dienstfahrten
            org.opencontainers.image.vendor=Löwemann IT Consulting
            org.opencontainers.image.url=https://www.loewemann.com

      - name: Bauen und ablegen
        uses: docker/build-push-action@v5
        with:
          context: .
          # amd64 fuer NAS und PC, arm64 fuer Raspberry Pi und Apple Silicon
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Zwischenspeicher: spart bei jedem weiteren Bauen mehrere Minuten
          cache-from: type=gha
          cache-to: type=gha,mode=max
